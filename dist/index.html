<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11150f" />
  <meta name="color-scheme" content="dark" />
  <title>Una flor amarilla para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="scene" id="scene">
    <div class="ambient" aria-hidden="true"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <section class="card" aria-labelledby="main-title">
      <p class="date">21 · 09 · 2026</p>
      <p class="eyebrow" id="intro">Tengo algo para ti.</p>

      <button class="flower-button" id="flowerButton" type="button" aria-label="Hacer florecer la flor">
        <svg class="flower" viewBox="0 0 320 420" role="img" aria-label="Flor amarilla animada">
          <defs>
            <radialGradient id="petalGradient" cx="50%" cy="42%" r="65%">
              <stop offset="0%" stop-color="#fff4a7" />
              <stop offset="54%" stop-color="#f8cf46" />
              <stop offset="100%" stop-color="#e8a824" />
            </radialGradient>
            <radialGradient id="centerGradient" cx="40%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#7b5420" />
              <stop offset="100%" stop-color="#3d2911" />
            </radialGradient>
            <linearGradient id="stemGradient" x1="0" x2="1">
              <stop offset="0%" stop-color="#355a32" />
              <stop offset="100%" stop-color="#6e8e49" />
            </linearGradient>
            <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="8" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <g class="stem-group">
            <path class="stem" d="M159 385 C159 320, 160 245, 161 178" pathLength="1" />
            <path class="leaf leaf-left" d="M154 296 C118 271, 91 276, 72 307 C107 315, 132 309, 154 296 Z" />
            <path class="leaf leaf-right" d="M163 247 C196 220, 225 223, 247 250 C214 263, 188 259, 163 247 Z" />
          </g>

          <g class="bloom" transform="translate(160 151)">
            <circle class="halo" r="82" />
            <g class="petals">
              <ellipse class="petal p1" rx="26" ry="66" transform="rotate(0) translate(0 -49)" />
              <ellipse class="petal p2" rx="26" ry="66" transform="rotate(45) translate(0 -49)" />
              <ellipse class="petal p3" rx="26" ry="66" transform="rotate(90) translate(0 -49)" />
              <ellipse class="petal p4" rx="26" ry="66" transform="rotate(135) translate(0 -49)" />
              <ellipse class="petal p5" rx="26" ry="66" transform="rotate(180) translate(0 -49)" />
              <ellipse class="petal p6" rx="26" ry="66" transform="rotate(225) translate(0 -49)" />
              <ellipse class="petal p7" rx="26" ry="66" transform="rotate(270) translate(0 -49)" />
              <ellipse class="petal p8" rx="26" ry="66" transform="rotate(315) translate(0 -49)" />
            </g>
            <circle class="flower-center" r="35" />
            <g class="center-dots" aria-hidden="true">
              <circle cx="-10" cy="-8" r="2.2"/><circle cx="5" cy="-12" r="2"/><circle cx="12" cy="3" r="2.4"/>
              <circle cx="-5" cy="10" r="2"/><circle cx="-16" cy="6" r="1.7"/><circle cx="3" cy="4" r="1.6"/>
            </g>
          </g>
        </svg>
        <span class="tap-hint" id="tapHint">Toca para hacerla florecer</span>
      </button>

      <div class="message" id="message" aria-live="polite">
        <h1 id="main-title">Una flor amarilla para ti.</h1>
        <p>No podía dártela de la forma habitual,<br />así que hice que una floreciera aquí para ti.</p>
        <button class="again" id="againButton" type="button">Toca la flor una vez más</button>
        <p class="signature" id="signature">— Nelson</p>
      </div>
    </section>

    <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>
    <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
